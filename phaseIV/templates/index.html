<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Home</title>
  <style>
    body {
      font-family: sans-serif;
      background-color: #f8f9fa;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .container {
      max-width: 600px;
      background: white;
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    h1 {
      margin-bottom: 1rem;
      font-size: 1.75rem;
      color: #333;
    }
    .link-list {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-top: 1rem;
    }
    a {
      text-decoration: none;
      color: #007bff;
      padding: 0.5rem;
      border: 1px solid #007bff;
      border-radius: 4px;
      transition: all 0.2s ease-in-out;
    }
    a:hover {
      background-color: #007bff;
      color: white;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Airline Management System</h1>
    <div class="link-list">
      <a href="{{ url_for('add_airplane') }}">Add Airplane</a>
      <a href="{{ url_for('add_person') }}">Add Person</a>
      <a href="{{ url_for('assign_pilot') }}">Assign Pilot</a>
      <a href="{{ url_for('flight_landing') }}">Flight Landing</a>
      <a href="{{ url_for('flight_takeoff') }}">Flight Takeoff</a>
      <a href="{{ url_for('grant_revoke_pilot') }}">Grant or Revoke Pilot License</a>
      <a href="{{ url_for('offer_flight') }}">Offer Flight</a>
      <a href="{{ url_for('passengers_board') }}">Passengers Board</a>
      <a href="{{ url_for('passengers_disembark') }}">Passengers Disembark</a>
      <a href="{{ url_for('recycle_crew') }}">Recycle Crew</a>
      <a href="{{ url_for('retire_flight') }}">Retire Flight</a>
      <a href="{{ url_for('simulation_cycle') }}">Simulation Cycle</a>
    </div>
  </div>
</body>
</html>
